<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity Base</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--card2:#1c2545;--line:#2a3560;--tx:#eef1fb;--mut:#8b96bd;--p1:#4da3ff;--p2:#c07bff;--hx:#3fd6a0;--ok:#3fd6a0;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 40px;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:18px;margin:0;letter-spacing:.02em}
.st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px}
.row{display:grid;gap:10px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:repeat(3,1fr)}
.slot{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 12px;min-height:84px;cursor:pointer;text-align:left;color:var(--tx);font:inherit;width:100%}
.slot:active{background:var(--card2)}
.slot .lb{font-size:11px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.slot .nm{font-size:14px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.slot.empty .nm{color:var(--mut);font-weight:400}
.big{min-height:112px}
.p1{border-color:#2a5d99}.p1 .lb{color:var(--p1)}
.p2{border-color:#6a4a99}.p2 .lb{color:var(--p2)}
.hx .lb{color:var(--hx)}
.x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:#0006;color:var(--mut);font-size:16px;line-height:1}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
.pn{background:var(--bg);width:100%;max-width:640px;margin:0 auto;height:86vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;border:1px solid var(--line)}
.ph{padding:14px 14px 8px}
.ph .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.ph button.c{background:none;border:0;color:var(--mut);font-size:15px;padding:6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:13px}
.chip.on{background:var(--card2);color:var(--tx);border-color:var(--p1)}
#list{overflow:auto;flex:1;padding:4px 14px 20px;-webkit-overflow-scrolling:touch}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #ffffff10;color:var(--tx);font:inherit;font-size:14px;padding:13px 2px}
.it small{color:var(--mut);margin-left:6px}
.it:active{background:var(--card2)}
.none{color:var(--mut);padding:24px 2px;text-align:center}
.hint{font-size:12px;color:var(--mut);margin-top:26px;text-align:center}
</style>
</head>
<body>
<header><h1>Infinity Base</h1><div class="st"><span class="dot" id="dot"></span><span id="stx">Waiting for the game</span></div></header>

<h2>Players</h2>
<div class="row r2">
<div class="slot big p1 empty" data-s="0"><div class="lb">PLAYER 1</div><div class="nm"></div></div>
<div class="slot big p2 empty" data-s="1"><div class="lb">PLAYER 2</div><div class="nm"></div></div>
</div>

<h2>Power discs</h2>
<div class="row r2">
<div class="slot p1 empty" data-s="3"><div class="lb">P1 · DISC 1</div><div class="nm"></div></div>
<div class="slot p2 empty" data-s="5"><div class="lb">P2 · DISC 1</div><div class="nm"></div></div>
<div class="slot p1 empty" data-s="4"><div class="lb">P1 · DISC 2</div><div class="nm"></div></div>
<div class="slot p2 empty" data-s="6"><div class="lb">P2 · DISC 2</div><div class="nm"></div></div>
</div>

<h2>Hexagon (playsets, toy boxes)</h2>
<div class="row r3">
<div class="slot hx empty" data-s="2"><div class="lb">HEX 1</div><div class="nm"></div></div>
<div class="slot hx empty" data-s="7"><div class="lb">HEX 2</div><div class="nm"></div></div>
<div class="slot hx empty" data-s="8"><div class="lb">HEX 3</div><div class="nm"></div></div>
</div>
<div class="hint">Tap a slot to pick a figure. Changes apply immediately, even in-game.</div>

<div id="sheet"><div class="pn">
<div class="ph"><div class="t"><span id="pt">Choose</span><button class="c" id="pc">Close</button></div>
<input id="q" type="search" placeholder="Search…" autocomplete="off">
<div class="chips" id="cc"></div><div class="chips" id="cv"></div></div>
<div id="list"></div></div></div>

<script>
const CAT=['Characters','Playsets','Discs','Toy boxes'],VER=['1.0','2.0','3.0'];
const DEF={0:0,1:0,2:1,7:1,8:1,3:2,4:2,5:2,6:2};
const TITLE={0:'Player 1',1:'Player 2',2:'Hexagon 1',7:'Hexagon 2',8:'Hexagon 3',3:'Player 1 · disc 1',4:'Player 1 · disc 2',5:'Player 2 · disc 1',6:'Player 2 · disc 2'};
let LIB=[],ST={s:[-1,-1,-1,-1,-1,-1,-1,-1,-1],c:0},cur=0,fc=0,fv=-1;
const $=s=>document.querySelector(s);
async function J(u){const r=await fetch(u);return r.json()}
function paint(){
 document.querySelectorAll('.slot').forEach(e=>{
  const s=+e.dataset.s,id=ST.s[s],n=e.querySelector('.nm');
  e.classList.toggle('empty',id<0);
  n.textContent=id<0?'Empty':(LIB[id]?LIB[id][0]:'#'+id);
  let x=e.querySelector('.x');
  if(id>=0&&!x){x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=async ev=>{ev.stopPropagation();ST=await J('/api/remove?slot='+s);paint()};e.appendChild(x)}
  if(id<0&&x)x.remove();
 });
 $('#dot').classList.toggle('on',!!ST.c);
 $('#stx').textContent=ST.c?'Game connected':'Waiting for the game';
}
function chips(){
 const cc=$('#cc'),cv=$('#cv');cc.innerHTML='';cv.innerHTML='';
 CAT.forEach((n,i)=>{const b=document.createElement('button');b.className='chip'+(i==fc?' on':'');b.textContent=n;b.onclick=()=>{fc=i;chips();rows()};cc.appendChild(b)});
 [['All',-1],['1.0',0],['2.0',1],['3.0',2]].forEach(([n,v])=>{const b=document.createElement('button');b.className='chip'+(v==fv?' on':'');b.textContent=n;b.onclick=()=>{fv=v;chips();rows()};cv.appendChild(b)});
}
function rows(){
 const q=$('#q').value.trim().toLowerCase(),L=$('#list');L.innerHTML='';let n=0;
 for(let i=0;i<LIB.length&&n<250;i++){
  const e=LIB[i];
  if(e[1]!=fc||(fv>=0&&e[2]!=fv)||(q&&e[0].toLowerCase().indexOf(q)<0))continue;
  const b=document.createElement('button');b.className='it';b.textContent=e[0];
  const sm=document.createElement('small');sm.textContent=VER[e[2]];b.appendChild(sm);
  b.onclick=async()=>{ST=await J('/api/place?slot='+cur+'&id='+i);paint();close()};
  L.appendChild(b);n++;
 }
 if(!n)L.innerHTML='<div class="none">No results</div>';
}
function open_(s){cur=s;fc=DEF[s];fv=-1;$('#q').value='';$('#pt').textContent=TITLE[s];chips();rows();$('#sheet').classList.add('on')}
function close(){$('#sheet').classList.remove('on')}
document.querySelectorAll('.slot').forEach(e=>e.onclick=()=>open_(+e.dataset.s));
$('#pc').onclick=close;$('#q').oninput=rows;
$('#sheet').onclick=e=>{if(e.target.id=='sheet')close()};
async function poll(){try{ST=await J('/api/state');paint()}catch(e){}setTimeout(poll,2500)}
(async()=>{try{LIB=await J('/api/lib')}catch(e){}poll()})();
</script>
</body>
</html>
